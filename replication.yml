paper:
  study_handle: rep-template
  title: "Minimal folder-backed template study"
  year: "2026a"
  authors: ReplicateEverything Team
  source_repository: https://github.com/replicate-anything/replicateEverything
  abstract: >
    Unpublished template study for replicateEverything. Demonstrates a minimal
    folder-backed layout: CSV data, one estimatr table, HTML display output,
    and substantive tests. No journal article DOI.
  study_url: https://github.com/replicate-anything/rep-template
  # R packages needed to run this study (also listed per-step under dependencies:)
  dependencies:
    - estimatr
    - knitr

maintainer:
  name: Macartan Humphreys
  email: macartan.humphreys@wzb.eu

collections:
  - IPI

repo: replicate-anything/rep-template

# Engines used in this study (r, stata, and/or python). Copied into registry stubs.
languages:
  - r

steps:
  - id: tab_1                 # stable key: links code (make_tab_1 / format_tab_1), DAG, Run, tests
    type: table              # table | figure | transform | format — Shiny sidebar grouping
    label: Simple table   # short name in Display sidebar / DAG
    description: OLS of Y on X with robust SEs (estimatr::lm_robust)  # hover + Display title (label_full)
    # omit parents when root (do not write parents: [])
    engine: r                # r | stata | python (default r)
    data: data/data.csv      # passed into make_*(); often same as inputs for simple studies
    inputs:                  # files this step reads (raw data/ or prior outputs/)
      - data/data.csv
    code: code/tab_1.R       # script defining make_<id> / format_<id>
    format: format_tab_1     # format_* function name (or path to a format helper .R)
# Prefer outputs: over deprecated artifact: in comments only
    outputs:                 # files this step writes under outputs/
      - outputs/tab_1.html
    dependencies:            # step-level R pkgs (unioned with paper.dependencies for audit)
      - estimatr
      - knitr

  # Format child: wires format_* for Display / run_replication(..., format = TRUE).
  # Not shown in the Shiny sidebar. No label: (unused on format steps).
  # Still required as an explicit type: format step in unified steps: yaml (not auto-inferred
  # from make_*/format_* alone; legacy prep+replications yaml auto-creates <id>_format).
  - id: tab_1_format
    type: format
    parent: tab_1
    code: code/tab_1.R
